apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-keyframes-worker
  labels:
    app: video-keyframes-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-keyframes-worker
  template:
    metadata:
      labels:
        app: video-keyframes-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: photoprocessor/video-transcode-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "video_keyframes.videoKeyframesWorker"]
          env:
            - name: FRAME_INTERVAL_SECONDS
              value: "1"
          envFrom:
            - configMapRef:
                name: video-worker-config
            - secretRef:
                name: video-worker-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
