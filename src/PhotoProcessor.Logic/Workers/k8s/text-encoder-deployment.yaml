apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-text-encoder
  labels:
    app: clip-text-encoder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clip-text-encoder
  template:
    metadata:
      labels:
        app: clip-text-encoder
    spec:
      containers:
        - name: encoder
          image: photoprocessor/image-embedding-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "image_embedding.textService:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: clip-text-encoder
spec:
  type: LoadBalancer
  selector:
    app: clip-text-encoder
  ports:
    - port: 8001
      targetPort: 8000
