services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_NOTIFY_AMQP_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_URL_PRIMARY: "amqp://app:app@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_PRIMARY: "minio-events"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_PRIMARY: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: "photo-uploaded"
      MINIO_NOTIFY_AMQP_DURABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_PRIMARY: "2"
      MINIO_NOTIFY_AMQP_ENABLE_SECONDARY: "on"
      MINIO_NOTIFY_AMQP_URL_SECONDARY: "amqp://app:app@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_SECONDARY: "minio-events"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_SECONDARY: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_SECONDARY: "video-uploaded"
      MINIO_NOTIFY_AMQP_DURABLE_SECONDARY: "on"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_SECONDARY: "2"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data 
    depends_on:
      rabbitmq:
        condition: service_healthy
  # One-shot pod to await MiniO, create the 'media' bucket, and register the upload event.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/media;
      mc event add --ignore-existing local/media arn:minio:sqs::PRIMARY:amqp --event put --prefix photos/;
      mc event add --ignore-existing local/media arn:minio:sqs::SECONDARY:amqp --event put --prefix videos/raw/;
      "

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  # Docker Desktop runs Kubernetes pods as containers on this same daemon, so one cAdvisor sees both the
  # compose services and every worker pod. A real cluster would scrape the kubelet's own cAdvisor instead.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=io.kubernetes.pod.name,io.kubernetes.container.name,io.kubernetes.pod.namespace
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    environment:
      # Local-only convenience so the Progress page can embed panels without a login round trip.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
