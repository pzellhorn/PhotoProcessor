services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_AMQP_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_URL_PRIMARY: "amqp://app:app@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_PRIMARY: "minio-events"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_PRIMARY: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: "photo-uploaded"
      MINIO_NOTIFY_AMQP_DURABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_PRIMARY: "2"
      MINIO_NOTIFY_AMQP_ENABLE_SECONDARY: "on"
      MINIO_NOTIFY_AMQP_URL_SECONDARY: "amqp://app:app@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_SECONDARY: "minio-events"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_SECONDARY: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_SECONDARY: "video-uploaded"
      MINIO_NOTIFY_AMQP_DURABLE_SECONDARY: "on"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_SECONDARY: "2"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data 
    depends_on:
      rabbitmq:
        condition: service_healthy
  # One-shot pod to await MiniO, create the 'media' bucket, and register the upload event.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/media;
      mc event add --ignore-existing local/media arn:minio:sqs::PRIMARY:amqp --event put --prefix photos/;
      mc event add --ignore-existing local/media arn:minio:sqs::SECONDARY:amqp --event put --prefix videos/raw/;
      "

volumes:
  db_data:
  rabbitmq_data:
  minio_data:
